name: Deploy to GitHub Pages

# Compila el sitio estático y lo sube directamente a GitHub Pages. La fuente
# de Pages del repo es "GitHub Actions" (Settings → Pages): antes se servía
# desde la rama `gh-pages` con el constructor "legacy", que se colgaba.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empuja dos veces seguidas, cancela el despliegue anterior.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      # `output: 'export'` en next.config.mjs hace que `next build` genere
      # directamente la carpeta `out/`. El comando `next export` ya no existe
      # (se eliminó en Next 14).
      - name: Build estático
        run: npm run build

      - name: Verificar que el export es válido
        run: |
          test -f out/index.html || { echo "Falta out/index.html"; exit 1; }
          echo "Export correcto:"
          ls -la out

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
